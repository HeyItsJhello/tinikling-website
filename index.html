<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/assets/Logo.webp" type="image/webp" />
        <link rel="preload" as="image" href="/assets/hero.webp" fetchpriority="high" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tinikling Dance Company</title>

        <!-- Primary Meta Tags -->
        <meta name="title" content="Franklin's Tinikling Dance Club" />
        <meta
            name="description"
            content="Franklin's Tinikling Dance Club is a student-led cultural dance group specializing in traditional Philippine Folk Dance. Established in 2008, we share the beauty of Filipino culture through dance."
        />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://fhstdc.com/" />
        <meta property="og:title" content="Franklin's Tinikling Dance Club" />
        <meta
            property="og:description"
            content="Franklin's Tinikling Dance Club is a student-led cultural dance group specializing in traditional Philippine Folk Dance. Established in 2008, we share the beauty of Filipino culture through dance."
        />
        <meta
            property="og:image"
            content="https://fhstdc.com/assets/hero.webp"
        />
        <meta property="og:image:width" content="1920" />
        <meta property="og:image:height" content="1280" />
        <meta property="og:image:type" content="image/webp" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://fhstdc.com/" />
        <meta
            property="twitter:title"
            content="Franklin's Tinikling Dance Club"
        />
        <meta
            property="twitter:description"
            content="Franklin's Tinikling Dance Club is a student-led cultural dance group specializing in traditional Philippine Folk Dance. Established in 2008, we share the beauty of Filipino culture through dance."
        />
        <meta
            property="twitter:image"
            content="https://fhstdc.com/assets/hero.webp"
        />
    </head>
    <body>
        <div id="splash">
            <img src="/assets/Logo.webp" alt="" />
        </div>
        <style>
            #splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #ffffe0;
                transition: opacity 0.4s ease;
            }
            #splash img {
                width: 7rem;
                height: 7rem;
                object-fit: contain;
                animation: splash-pulse 1.2s ease-in-out infinite;
            }
            #splash.done {
                opacity: 0;
                pointer-events: none;
            }
            @keyframes splash-pulse {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(0.88); opacity: 0.7; }
            }
            @media (prefers-reduced-motion: reduce) {
                #splash img { animation: none; }
            }
        </style>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
